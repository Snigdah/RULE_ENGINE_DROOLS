# Main configuration lives in application.yml (and application-sentinel.yml).
#
# This file must exist: the changeboard jar ships its own classpath:application.properties
# (dummy Oracle datasource, Kafka, URLs). Spring Boot would load it, and .properties beats .yml
# at the same location, so it would override our datasource. Having our own file shadows it.

# changeboard brings spring-kafka; the rule engine does not use Kafka.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
